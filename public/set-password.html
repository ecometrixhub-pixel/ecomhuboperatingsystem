<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your password · EcomHub OS</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script>window.__authHash = location.hash; window.__authQuery = location.search;</script>
</head>
<body data-page="set-password">
  <main class="auth-main" style="min-height:100vh">
    <div class="auth-card">
      <div class="brand" style="padding:0">
        <div class="brand-mark">EH</div>
        <div class="brand-name">EcomHub OS<small>Ecometrix Hub</small></div>
      </div>
      <div>
        <h2 id="sp-title">Set your password</h2>
        <p class="sub" id="sp-sub">Checking your link…</p>
      </div>
      <div id="msg" class="hidden"></div>
      <form id="sp-form" class="hidden" novalidate>
        <div class="field">
          <label for="pw1">New password</label>
          <input id="pw1" class="input" type="password" autocomplete="new-password" minlength="8" required>
          <span class="hint">At least 8 characters.</span>
        </div>
        <div class="field">
          <label for="pw2">Confirm password</label>
          <input id="pw2" class="input" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Save password and continue</button>
      </form>
      <p class="auth-foot" id="tracking-note"></p>
    </div>
  </main>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
