<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit a lead · Ecometrix Hub</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="public-page">
  <main class="public-wrap">
    <div class="brand" style="padding:0 0 22px">
      <div class="brand-mark">EH</div>
      <div class="brand-name"><span id="company">Ecometrix Hub</span><small>Lead form</small></div>
    </div>
    <section class="panel public-card">
      <div class="modal-head lead-head" style="padding:22px 24px 0">
        <span class="mh-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg></span>
        <div><h1 style="font-size:18px">Add inbound or outreach lead</h1><p class="muted small">Enroll a new prospect into the Ecometrix Hub pipeline</p></div>
      </div>
      <form id="form" novalidate style="padding:20px 24px 24px"><div id="fields"><p class="muted">Loading form…</p></div>
        <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-primary btn-lg" type="submit" id="submit">Create lead</button></div>
      </form>
      <div id="done" class="hidden empty" style="padding:48px 24px">
        <h3>Lead received</h3><p>Thanks. The Ecometrix Hub team can see it now.</p>
        <button class="btn btn-primary" id="again" style="margin-top:16px">Submit another lead</button>
      </div>
    </section>
  </main>
  <script type="module" src="/js/public-form.js"></script>
</body>
</html>
